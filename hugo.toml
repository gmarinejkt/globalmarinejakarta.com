[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  # Required by tools/lib/safe-table.js: AI-generated tables are rendered as raw HTML
  # (<table class="table">), which Hugo only keeps when unsafe = true.
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"
