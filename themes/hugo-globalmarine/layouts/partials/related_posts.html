{{ $related := .Site.RegularPages.Related . | first 3 }}
{{ with $related }}
<section class="gm-related">
  <div class="gm-related-head">
    <h2>{{ partial "t.html" (dict "id" "Artikel Terkait" "en" "Related Articles") }}</h2>
  </div>
  <div class="row g-4">
    {{ range . }}<div class="col-md-6 col-lg-4">{{ partial "post-card.html" . }}</div>{{ end }}
  </div>
</section>
{{ end }}
