<article class="gm-card h-100">
  <a class="gm-card-img" href="{{ .RelPermalink }}" tabindex="-1" aria-hidden="true">
    <img src="{{ .Params.featured_image | default site.Params.defaultImage }}" alt="{{ .Title }}" loading="lazy">
  </a>
  <div class="gm-card-body">
    <time class="gm-card-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
    <h3 class="gm-card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="gm-card-text">{{ with .Description }}{{ . | plainify | truncate 130 }}{{ else }}{{ .Summary | plainify | truncate 130 }}{{ end }}</p>
    <a class="gm-card-more" href="{{ .RelPermalink }}">{{ partial "t.html" (dict "id" "Baca selengkapnya" "en" "Read more") }} <i class="fas fa-arrow-right"></i></a>
  </div>
</article>
