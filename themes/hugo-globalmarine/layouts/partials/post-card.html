<article class="service-card post-card">
  {{ with .Params.featured_image }}<a href="{{ $.RelPermalink }}"><img src="{{ . }}" alt="{{ $.Title }}" loading="lazy"></a>{{ end }}
  <div class="card-body">
    <h3 class="card-title h5"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="text-muted small mb-2">{{ .Date.Format "2 January 2006" }}</p>
    <p>{{ .Summary | plainify | truncate 140 }}</p>
  </div>
</article>
