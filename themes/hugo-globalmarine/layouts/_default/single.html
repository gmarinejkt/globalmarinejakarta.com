{{ define "main" }}
<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <article class="col-lg-9 post-single">
        <nav aria-label="breadcrumb"><ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/">Beranda</a></li>
          <li class="breadcrumb-item"><a href="/blog/">Blog</a></li>
          <li class="breadcrumb-item active" aria-current="page">{{ .Title | truncate 60 }}</li>
        </ol></nav>
        <h1 class="mb-2">{{ .Title }}</h1>
        <p class="text-muted"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>
        {{ with .Params.featured_image }}<img class="img-fluid rounded mb-4" src="{{ . }}" alt="{{ $.Title }}">{{ end }}
        <div class="post-content">{{ .Content }}</div>
        {{ partial "article-prevnext.html" . }}
        {{ partial "related_posts.html" . }}
      </article>
    </div>
  </div>
</section>
{{ end }}
